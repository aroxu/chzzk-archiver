services:
  archiver:
    image: ${ARCHIVER_IMAGE:-ghcr.io/aroxu/chzzk-archiver:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ARCHIVER_SECRET_KEY: ${ARCHIVER_SECRET_KEY:?set ARCHIVER_SECRET_KEY in .env}
      ARCHIVER_COOKIE_ENCRYPTION_KEY: ${ARCHIVER_COOKIE_ENCRYPTION_KEY:-}
      ARCHIVER_SECURE_COOKIES: ${ARCHIVER_SECURE_COOKIES:-false}
      ARCHIVER_DOWNLOAD_CONNECTIONS: ${ARCHIVER_DOWNLOAD_CONNECTIONS:-16}
      ARCHIVER_HLS_DOWNLOAD_CONCURRENCY: ${ARCHIVER_HLS_DOWNLOAD_CONCURRENCY:-16}
    volumes:
      - ./data:/data
      - ./recordings:/recordings
    restart: unless-stopped
